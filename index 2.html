<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>教祖くんの大田ケア奮闘物語</title><style>
:root{font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif;color:#263044;background:#f3efe8}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#dcecf7,#fff3dd 55%,#f4dce3)}button{font:inherit;cursor:pointer}#app{max-width:950px;margin:auto;padding:20px 14px 48px}.panel{background:#fffdf9;border:3px solid #283e5a;border-radius:23px;box-shadow:0 8px 0 #283e5a22;overflow:hidden}.hero{background:linear-gradient(135deg,#172c4d,#32628a);color:white;text-align:center;padding:26px 16px}.hero h1{font-size:clamp(28px,6vw,51px);line-height:1.25;margin:10px 0;color:#ffdc77;text-shadow:3px 4px #0e213b}.hero small{letter-spacing:3px}.hero img{height:245px;width:245px;object-fit:cover;object-position:top;border-radius:50%;border:6px solid white;background:#fff}.hero p{font-weight:700}.primary,.secondary{border:0;border-radius:15px;padding:15px 20px;font-weight:900;margin:7px;box-shadow:0 4px 0 #172c4d55}.primary{background:#ffd24d;color:#263044}.secondary{background:#e7f2ff;color:#263044}.primary:hover,.choice:hover{transform:translateY(-2px);filter:brightness(1.04)}.center{text-align:center}.body{padding:20px}.scene-title{background:#243f66;color:white;padding:15px 20px;font-weight:900;font-size:clamp(18px,3.5vw,25px)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stats{padding:15px;background:#eaf1f6;border-radius:15px;margin:14px 0}.stat{font-size:12px;font-weight:700;margin:6px 0}.bar{height:9px;background:#cad5de;border-radius:12px;overflow:hidden;margin-top:4px}.fill{height:100%;background:#3b96a3;transition:width .4s}.dialog{background:#fff7e8;border:2px solid #e4d1ad;border-radius:14px;padding:16px;margin:14px 0;line-height:1.95;white-space:pre-line}.character{width:130px;height:130px;object-fit:cover;object-position:top;border-radius:18px;background:#fff2d9;border:3px solid #d9b983}.scene-layout{display:flex;gap:18px;align-items:center}.choice{display:block;width:100%;text-align:left;border:2px solid #b7cde0;border-radius:14px;background:#eaf5ff;padding:15px;margin:10px 0;font-weight:800;color:#24354e;transition:.12s}.choice:nth-child(2){background:#edfae9;border-color:#b5d6b5}.choice:nth-child(3){background:#fff0dc;border-color:#edc7a3}.choice:nth-child(4){background:#ffe8f0;border-color:#e7b8c8}.choice small{display:block;font-weight:500;margin-top:5px;line-height:1.6}.tag{display:inline-block;background:#f8c95b;border-radius:99px;padding:5px 12px;font-size:12px;font-weight:900}.delta{display:inline-block;padding:6px 10px;border-radius:10px;margin:4px;background:#eaf0f5;font-size:13px}.good{color:#15805c}.bad{color:#b44842}.ending{font-size:29px;font-weight:900;color:#174c75}.footer{text-align:center;color:#64748b;font-size:12px;padding:15px}.log{font-size:13px;line-height:1.8}.notice{background:#fff4cb;padding:12px;border-radius:12px;margin:12px 0}@media(max-width:560px){.grid{grid-template-columns:1fr}.scene-layout{gap:10px}.character{width:90px;height:90px}.body{padding:14px}}

const app=document.getElementById('app');const clamp=n=>Math.max(0,Math.min(100,n));
function statsHtml(){return '<div class="stats"><b>📋 大田ケアのステータス</b><div class="grid">'+Object.entries(state.stats).map(([k,v])=>`<div class="stat">${labels[k]}　${v}/100<div class="bar"><div class="fill" style="width:${v}%;background:${k==='energy'?'#d66b6b':k==='miracle'?'#c59a28':'#3b96a3'}"></div></div></div>`).join('')+'</div></div>'}
function buttons(){return '<button class="secondary" onclick="reset()">↩ 最初から</button>'}
function render(){if(state.phase==='title'){app.innerHTML=`<section class="panel"><div class="hero"><small>大田ケア PRESENTS</small><h1>教祖くんの<br>大田ケア奮闘物語</h1><img src="${IMG}" alt="教祖くん"><p>崩壊寸前の訪問看護ステーションを救え！</p><p>笑顔と根性と、ちょっとの奇跡。</p><button class="primary" onclick="start()">▶ ゲームスタート</button><button class="secondary" onclick="howto()">📖 遊び方</button></div><div class="body center">全6話・毎話4択・マルチエンディング<br><small>あなたの選択が、大田ケアの未来を変える。</small></div></section>`;return}
if(state.phase==='howto'){app.innerHTML=`<section class="panel"><div class="scene-title">📖 遊び方</div><div class="body"><p>全6話の物語を進め、毎回4つの行動から1つを選びます。選択で職員の信頼、職場の士気、経営の安定、教祖くんの体力、教祖力が変化します。</p><p>第2話は第1話の選択によって内容が変わり、第3話以降もこれまでの行動で会話が変化。最終的な数値でエンディングが決まります。</p><p>※架空のゲームです。現実の訪問看護の管理者配置や人員基準、労務・安全管理は適切に守る必要があります。</p><button class="primary" onclick="start()">▶ はじめる</button>${buttons()}</div></section>`;return}
if(state.phase==='result'){const d=state.last.delta;app.innerHTML=`<section class="panel"><div class="scene-title">✨ 第${state.chapter}話：行動の結果</div><div class="body"><span class="tag">${state.last.title}</span><div class="scene-layout"><img class="character" src="${IMG}" alt="教祖くん"><div class="dialog" style="flex:1">${state.last.reply}</div></div><h3>ステータスの変化</h3>${Object.entries(d).map(([k,v])=>`<span class="delta ${v>=0?'good':'bad'}">${labels[k]} ${v>0?'+':''}${v}</span>`).join('')}${statsHtml()}<div class="center"><button class="primary" onclick="advance()">${state.chapter===6?'🏆 エンディングを見る':'▶ 次のシーンへ'}</button>${buttons()}</div></div></section>`;return}
if(state.phase==='ending'){let s=state.stats;let type,title,description;if(s.trust<=18||s.morale<=12||s.business<=12){type='💔';title='大田ケア、誰もいなくなる';description='不安と混乱が広がり、職員が次々に離れてしまった。教祖くんと観葉植物だけが残る……。でも、やり直すチャンスはある！'}else if(s.energy<=12){type='😴';title='教祖くん、燃え尽きる';description='大田ケアはなんとか持ち直した。でも、教祖くんがすべてを背負いすぎた。「次は……休みをください……」'}else if(s.trust>=70&&s.morale>=65&&s.business>=65&&s.energy>=30&&s.miracle>=55){type='🌈';title='大田ケア新時代！';description='みんなが支え合い、教祖くんがいなくても回る強いチームが誕生！ 教祖くん「やった！ ついに有給が取れるぞーー！」'}else if(s.trust>=60&&s.morale>=55&&s.miracle>=45){type='🏆';title='伝説の教祖くん';description='職員の信頼と笑顔を取り戻した教祖くん。全員から「教祖様ーー！」と胴上げされる！'}else{type='🌱';title='再建はここから！';description='すべての課題は解決していない。それでも、職員たちは一歩前に進んだ。教祖くん「明日も一緒に頑張ろう！」'}app.innerHTML=`<section class="panel"><div class="hero"><div style="font-size:55px">${type}</div><h1>THE END</h1><img src="${IMG}" alt="教祖くん"><h2>${title}</h2><p>${description}</p></div><div class="body">${statsHtml()}<h3>あなたの選択の記録</h3><div class="log">${state.history.map((h,i)=>`<p>第${i+1}話：${h.title}</p>`).join('')}</div><div class="center"><button class="primary" onclick="reset();start()">🔄 もう一度挑戦する</button>${buttons()}</div></div></section>`;return}
const data=state.chapter===2?routes[state.route]:chapters[state.chapter];let extra='';if(state.chapter>=3){if(state.stats.trust<30)extra='職員「教祖くん、本当に私たちのこと考えてくれていますか……？」\n\n';else if(state.stats.trust>=65)extra='職員「教祖くんがいてくれるなら、きっと乗り越えられます！」\n\n';if(state.stats.energy<25)extra+='教祖くん「少し休みたいけど……今は踏ん張りどころだ！」\n\n';if(state.stats.miracle>=50)extra+='✨ 教祖力が高まり、職員たちの表情にも希望が宿っている！\n\n'}app.innerHTML=`<section class="panel"><div class="scene-title">🎮 第${state.chapter}話「${data.title}」</div><div class="body">${statsHtml()}<div class="scene-layout"><img class="character" src="${IMG}" alt="教祖くん"><div class="dialog" style="flex:1">${extra+data.intro}</div></div><h3>教祖くん、どうする？</h3>${data.choices.map((x,i)=>`<button class="choice" onclick="choose(${i})">${x.title}<small>${x.desc}</small></button>`).join('')}<div class="center">${buttons()}</div></div></section>`}
function start(){state={phase:'scene',chapter:1,route:null,stats:{...initial},history:[],last:null};render()};function howto(){state.phase='howto';render()};function reset(){state.phase='title';render()};function choose(i){const data=state.chapter===2?routes[state.route]:chapters[state.chapter];const choice=data.choices[i];if(state.chapter===1)state.route=choice.flag;for(let k in choice.delta)state.stats[k]=clamp(state.stats[k]+choice.delta[k]);state.history.push({title:choice.title,chapter:state.chapter});state.last=choice;state.phase='result';render();window.scrollTo(0,0)}function advance(){if(state.chapter===6)state.phase='ending';else{state.chapter++;state.phase='scene'}render();window.scrollTo(0,0)}render();
</script></body></html>
